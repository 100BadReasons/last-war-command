<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last War Command</title>
<meta name="description" content="Game plan, goal progress and recaps for my Last War account.">
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #efeee9; --border: #dddcd5;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #75746f;
  --accent: #2a78d6; --track: #e6e5df; --good: #0ca30c; --good-text: #006300;
  --c-skill: #2a78d6; --c-gear: #eb6834; --c-research: #1baf7a; --c-honor: #eda100;
  --c-season: #e87ba4; --c-drone: #008300; --c-weapon: #4a3aa7; --c-build: #0e7c9e; --c-decor: #a23ea8;
  --h1: #2a78d6; --h2: #eb6834; --h3: #1baf7a; --h4: #4a3aa7; --h5: #e34948; --h6: #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f;
    --accent: #3987e5; --track: #2c2c29; --good-text: #5fd35f;
    --c-skill: #3987e5; --c-gear: #d95926; --c-research: #199e70; --c-honor: #c98500;
    --c-season: #d55181; --c-drone: #008300; --c-weapon: #9085e9; --c-build: #3aa6c9; --c-decor: #c26bc8;
    --h1: #3987e5; --h2: #d95926; --h3: #199e70; --h4: #9085e9; --h5: #e66767; --h6: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f;
  --accent: #3987e5; --track: #2c2c29; --good-text: #5fd35f;
  --c-skill: #3987e5; --c-gear: #d95926; --c-research: #199e70; --c-honor: #c98500;
  --c-season: #d55181; --c-drone: #008300; --c-weapon: #9085e9; --c-build: #3aa6c9; --c-decor: #c26bc8;
  --h1: #3987e5; --h2: #d95926; --h3: #199e70; --h4: #9085e9; --h5: #e66767; --h6: #d55181;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; }

/* top bar + drawer */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; color: var(--text); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; flex: 1; }
.brand b { font-size: 16px; }
.brand span { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 19; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: 272px; max-width: 84vw; background: var(--surface);
  border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform .22s ease; z-index: 20;
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; visibility: hidden;
}
body.menu-open .drawer { transform: none; visibility: visible; }
body.menu-open .scrim { opacity: 1; pointer-events: auto; }
.drawer .head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
.drawer .head b { font-size: 16px; }
.drawer a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px;
  color: var(--text); text-decoration: none; font-weight: 550;
}
.drawer a:hover { background: var(--surface-2); }
.drawer a[aria-current="page"] { background: var(--surface-2); color: var(--accent); }
.drawer .foot { margin-top: auto; color: var(--text-3); font-size: 12px; padding: 8px 12px; }

main.wrap { padding-top: 24px; padding-bottom: 8px; }
.view { display: none; }
.view.on { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; scroll-margin-top: 72px; }
.card.bare { background: none; border: 0; padding: 0 0 8px; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.chip svg.i { width: 14px; height: 14px; }

/* goal strip */
.pbar-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
.pbar-head .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
.pbar { display: flex; gap: 3px; height: 18px; margin: 8px 0 10px; }
.seg { flex: 1; border-radius: 4px; background: color-mix(in srgb, var(--tc) 22%, transparent); transition: background .2s; }
.seg.on { background: var(--tc); }
.pbar-legend { display: flex; gap: 6px; flex-wrap: wrap; }
.pbar-legend .chip svg.i { color: var(--tc); }
.pbar-legend .chip b { color: var(--text); font-variant-numeric: tabular-nums; }
.fbtn { border: 1px solid transparent; cursor: pointer; font-size: 12px; transition: opacity .15s, background .15s; }
.fbtn:hover { border-color: var(--tc, var(--border)); }
.fbtn[aria-pressed="true"] { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 18%, transparent); color: var(--text); }
.filtering .fbtn[aria-pressed="false"] { opacity: .55; }
.filtering .seg:not(.match) { opacity: .25; }
.fclear { background: none; border: 1px dashed var(--border); }
.power-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.goal-nums { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.goal-nums .big { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.goal-nums .arrow { color: var(--text-3); display: flex; }
.goal-title { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; margin-bottom: 4px; }
.goal .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* phase stepper */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); }
.stepper .ph { text-align: center; padding: 0 6px; position: relative; cursor: pointer; border: 0; background: none; }
.stepper .ph::before { content: ""; position: absolute; top: 22px; left: -50%; width: 100%; height: 3px; background: var(--track); }
.stepper .ph:first-child::before { display: none; }
.stepper .ph.done + .ph::before, .stepper .ph.active::before { background: var(--accent); }
.stepper .ph.active ~ .ph::before { background: var(--track); }
.dot { position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; font-weight: 700; font-size: 17px; background: var(--surface); border: 3px solid var(--track); color: var(--text-2); }
.ph.active .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 15%, transparent); }
.ph.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.ph .nm { font-weight: 600; font-size: 14px; }
.ph .mt { color: var(--text-3); font-size: 12px; }

.dt { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }

/* step cards */
.phase-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.phase-head h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 10px; }
.badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; }
.phase-head .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.prog .t { width: 70px; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.prog .t i { display: block; height: 100%; background: var(--good); }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border-radius: 12px; background: var(--surface-2); position: relative; }
.tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, transparent); flex: none; }
.tile svg.i { width: 22px; height: 22px; }
.step .ttl { font-weight: 600; line-height: 1.3; padding-right: 22px; }
.step .meta { margin-top: 8px; }
.step .meta .chip, .step .meta .hero { background: var(--surface); }
.meta .chip { white-space: normal; min-width: 0; }
.hero { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text); background: var(--surface-2); border-radius: 999px; padding: 2px 9px 2px 2px; }
.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; background: var(--hc); flex: none; }
.step.done { opacity: .6; }
.step.done .ttl { text-decoration: line-through; text-decoration-color: var(--text-3); }
.chk { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--text-3); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; color: #fff; }
.chk:hover { border-color: var(--good); }
.chk[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.chk svg.i { width: 16px; height: 16px; stroke-width: 3; }
.step .ttl { padding-right: 30px; }
.subs { margin-top: 10px; border-top: 1px solid var(--border, var(--track)); padding-top: 8px; }
.subs summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 4px 0; }
.sub { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 8px 0; }
.sub + .sub { border-top: 1px dashed var(--track); }
.sub .st { font-size: 13px; font-weight: 600; line-height: 1.3; padding-top: 3px; }
.sub .meta { margin-top: 6px; }
.sub.done .st { text-decoration: line-through; color: var(--text-3); }
.chk.sm { position: static; width: 22px; height: 22px; border-radius: 6px; }
.chk.sm svg.i { width: 14px; height: 14px; }
.hint { color: var(--text-3); font-size: 12px; margin: -4px 0 12px; display: flex; align-items: center; gap: 6px; }
.hint svg.i { width: 14px; height: 14px; }
.legend-types { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin: 0 0 12px; }
.legend-types span { display: inline-flex; align-items: center; gap: 5px; }
.legend-types span svg.i { width: 15px; height: 15px; color: var(--tc); }

/* playbook */
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.rule { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.rule .tile { width: 34px; height: 34px; border-radius: 10px; --tc: var(--accent); }
.rule .tile svg.i { width: 18px; height: 18px; }

/* stats + bars */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.stat .l { color: var(--text-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.stat .l svg.i { width: 15px; height: 15px; }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.meter { margin-top: 16px; }
.meter-track { position: relative; height: 14px; background: var(--track); border-radius: 7px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 7px; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--surface); }
.ticks { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-top: 12px; font-size: 12px; color: var(--text-2); }
.mchip { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; white-space: nowrap; }
.mchip b { display: flex; align-items: center; gap: 4px; color: var(--text); font-size: 14px; }
.mchip b svg { width: 14px; height: 14px; color: var(--accent); }
.mchip.hit { outline: 1px solid var(--accent); }
.bars { display: grid; gap: 12px; margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 64px; align-items: center; gap: 10px; }
.bar-row .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.bar-row .nm small { display: block; color: var(--text-3); font-weight: 400; font-size: 12px; }
.bar-track { height: 18px; position: relative; }
.bar { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-row:hover .bar, .bar-row:focus-visible .bar { filter: brightness(1.12); }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.bench { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--text-3); }

/* tank heroes */
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.delta svg.i { width: 13px; height: 13px; }
.delta.up svg.i { color: var(--good-text); }
.delta.down svg.i { color: var(--c-season); transform: scaleY(-1); }
/* hero cards, styled like trading cards held in a hand */
.mtg { --f1: #e9e4cf; --f2: #d3caa8; --b1: #fdfaee; --b2: #e2d9b8; --tx: #f8f5ea;
  width: 22em; aspect-ratio: 63 / 88; background: #121110; border-radius: 1.05em; padding: .85em .85em .25em;
  display: flex; flex-direction: column; color: #141210; font-family: 'EB Garamond', Georgia, serif; text-align: left;
  box-shadow: 0 .4em 1.2em rgba(0, 0, 0, .45); }
.mtg[data-c="U"] { --f1: #2a78bf; --f2: #0d4f8b; --b1: #e3eef8; --b2: #a9c9e6; --tx: #e8f0f7; }
.mtg[data-c="B"] { --f1: #4a423e; --f2: #1f1a18; --b1: #dcd5d1; --b2: #a89f99; --tx: #ebe6e3; }
.mtg[data-c="R"] { --f1: #d8513a; --f2: #a2261b; --b1: #fbe0d3; --b2: #eaa58b; --tx: #f8e9e1; }
.mtg[data-c="G"] { --f1: #2a8a52; --f2: #0e5730; --b1: #dcefdc; --b2: #a3d1aa; --tx: #e8f2e5; }
.mtg .frame { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; gap: .32em; padding: .45em;
  border-radius: .45em .45em .7em .7em; background: radial-gradient(120% 70% at 30% 20%, rgba(255,255,255,.18), transparent 60%), linear-gradient(160deg, var(--f1), var(--f2)); }
.mtg .bar { flex: none; height: auto; display: flex; align-items: center; justify-content: space-between; gap: .4em; padding: .2em .55em; border-radius: .45em / 1em;
  background: linear-gradient(180deg, var(--b1), var(--b2)); box-shadow: inset 0 0 0 .1em rgba(0, 0, 0, .35), 0 .12em .2em rgba(0, 0, 0, .45); }
.mtg .name { font-weight: 700; font-size: 1.12em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtg .cost { display: flex; gap: .14em; flex: none; }
.mtg .pip { width: 1em; height: 1em; border-radius: 50%; display: grid; place-items: center; font-size: .78em; line-height: 1; color: #2b2410;
  background: radial-gradient(circle at 35% 35%, #fff6cf, #d9b64a); box-shadow: 0 .06em .1em rgba(0, 0, 0, .6); }
.mtg .art { flex: none; margin: 0 .25em; aspect-ratio: 4 / 3; overflow: hidden; border: .14em solid #1b1815; background: #1b1815; }
.mtg .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
.mtg .type { font-weight: 600; font-size: .86em; }
.mtg .set { width: .95em; height: .95em; border-radius: 50%; background: var(--hc); box-shadow: 0 0 0 .12em #111; flex: none; }
.mtg .text { flex: 1; min-height: 0; margin: 0 .3em; padding: .45em .6em 1.6em; background: var(--tx); border: .1em solid rgba(0, 0, 0, .4);
  font-size: .76em; line-height: 1.28; overflow: hidden; display: flex; flex-direction: column; gap: .32em; }
.mtg .text b { font-weight: 700; }
.mtg .text .arrow { color: #6a6358; margin: 0 .15em; }
.mtg .text hr { border: 0; border-top: .08em solid rgba(0, 0, 0, .25); margin: .15em 0; width: 100%; }
.mtg .flavor { font-style: italic; }
.mtg .pt { position: absolute; right: .55em; bottom: .25em; padding: .12em .5em; font-weight: 700; font-size: .98em; border-radius: .3em;
  background: linear-gradient(180deg, var(--b1), var(--b2)); box-shadow: inset 0 0 0 .1em rgba(0, 0, 0, .35), 0 .12em .2em rgba(0, 0, 0, .5); }
.mtg .foot { display: flex; justify-content: space-between; color: #e8e4dc; font-size: .58em; padding: .35em .3em 0; letter-spacing: .02em; }
.hand { --hw: min(180px, calc((100vw - 96px) / 4.1)); display: flex; justify-content: center; align-items: flex-end; padding: calc(var(--hw) * .18) 0 8px;
  min-height: calc(var(--hw) * 1.62); }
.hand .slot { all: unset; box-sizing: border-box; cursor: pointer; font-size: calc(var(--hw) / 22); margin-left: calc(var(--hw) * -.36);
  transform-origin: 50% 130%; transform: translateY(var(--y)) rotate(var(--r)); transition: transform .18s ease, filter .18s ease; position: relative; }
.hand .slot:first-child { margin-left: 0; }
.hand .slot:hover, .hand .slot:focus-visible { transform: translateY(calc(var(--y) - var(--hw) * .16)) rotate(var(--r)) scale(1.06); z-index: 6; }
.hand .slot:focus-visible .mtg { outline: 3px solid var(--accent); outline-offset: 3px; }
.hand-hint { text-align: center; color: var(--text-3); font-size: 13px; margin: 0; }
.pop { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(0, 0, 0, .62); padding: 16px; }
.pop.on { display: grid; }
.pop .inner { display: grid; justify-items: center; gap: 12px; }
.pop .mtg { font-size: min(16px, calc((100vw - 32px) / 22), calc((100vh - 120px) / 31)); animation: pop-in .18s ease-out; }
@keyframes pop-in { from { transform: translateY(24px) scale(.85); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pop .mtg { animation: none; } .hand .slot { transition: none; } }
.pop .ctl { display: flex; gap: 10px; }
.pop .ctl button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 8px 14px; font: 600 14px system-ui, sans-serif;
  background: #fcfcfb; color: #0b0b0b; cursor: pointer; }
.pop .ctl button svg.i { width: 16px; height: 16px; }
.pop .ctl .prev svg.i { transform: scaleX(-1); }
.hlegend { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.hlegend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.hlegend img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--hc); }
.chart-wrap { position: relative; }
.chart-wrap .xh { stroke: var(--text-3); stroke-width: 1; opacity: 0; }
.chart-wrap .hit { fill: transparent; cursor: crosshair; }
table.data td.num, table.data th.num { text-align: right; }
.tscroll { overflow-x: auto; }
.th-sub { display: block; font-weight: 400; font-size: 11px; color: var(--text-3); }
table.data td.old, table.data th.old { color: var(--text-3); }
table.data .delta { font-size: 14px; }
.tscroll table.data { min-width: 420px; }

/* recaps */
.tl { position: relative; padding-left: 28px; }
.tl::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl .card { position: relative; }
.tl .card::before { content: ""; position: absolute; left: -25px; top: 20px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.recap .date { color: var(--accent); font-size: 13px; font-weight: 700; }
.recap h3 { margin: 2px 0 12px; font-size: 18px; }
.hl { display: grid; gap: 8px; margin: 14px 0; }
.hl > div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.hl .tile { width: 30px; height: 30px; border-radius: 8px; }
.hl .tile svg.i { width: 16px; height: 16px; }
.nextbox { display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.nextbox svg.i { color: var(--accent); }
.src { color: var(--text-3); font-size: 12px; margin-top: 10px; }

svg text { fill: var(--text-2); font-size: 12px; }
.empty { color: var(--text-3); font-size: 14px; display: flex; gap: 10px; align-items: center; margin: 8px 0 0; }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 10px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); }
table.data th { color: var(--text-2); border-top: 0; }
#tip { position: fixed; pointer-events: none; z-index: 30; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .1s; max-width: 240px; }
.note-form textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.note-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.note-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.sm svg.i { width: 15px; height: 15px; }
.note .btn.ghost { background: var(--surface); }
.notes-list { display: grid; gap: 10px; }
.note { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.note .tile { width: 34px; height: 34px; border-radius: 10px; }
.note .tile svg.i { width: 18px; height: 18px; }
.note .when { color: var(--text-3); font-size: 12px; margin-top: 4px; }
.note.reviewed { opacity: .65; }
.note p { margin: 0; white-space: pre-wrap; }
footer.wrap { color: var(--text-3); font-size: 12px; padding-top: 16px; padding-bottom: 32px; }

@media (max-width: 520px) {
  .goal-nums .big { font-size: 22px; }
  .bar-row { grid-template-columns: 104px 1fr 56px; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat .v { font-size: 20px; }
  .ph .mt { display: none; }
  .ph .nm { font-size: 12px; }
}

const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n] || P.flag}</svg>`;
const TYPE = {
  skill: ['Skills', 'var(--c-skill)'], gear: ['Gear', 'var(--c-gear)'], research: ['Research', 'var(--c-research)'],
  weapon: ['Exclusive weapon', 'var(--c-weapon)'], honor: ['Wall of Honor', 'var(--c-honor)'],
  season: ['Season', 'var(--c-season)'], drone: ['Drone', 'var(--c-drone)'],
  build: ['Buildings', 'var(--c-build)'], decor: ['Decor', 'var(--c-decor)']
};
const typeColor = t => (TYPE[t] || [, 'var(--accent)'])[1];
const HEROES = ['Kimberly', 'Murphy', 'Williams', 'Stetmann', 'Marshall', 'Scarlett'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const av = n => `<span class="av" style="--hc:var(--h${(HEROES.indexOf(n) + 1) || 6})" aria-hidden="true">${esc(n[0])}</span>`;
const heroChip = n => `<span class="hero">${av(n)}${esc(n)}</span>`;
const costChip = c => c ? `<span class="chip">${ico('cost')}${esc(c)}</span>` : '';
const fmtM = v => (v / 1e6).toFixed(2) + 'M';
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

/* tooltip */
const tip = document.getElementById('tip');
function bindTip(node, html) {
  node.tabIndex = 0;
  const show = e => {
    tip.innerHTML = html; tip.style.opacity = 1;
    const r = node.getBoundingClientRect();
    const x = e && e.clientX ? e.clientX : r.left + r.width / 2;
    const y = e && e.clientY ? e.clientY : r.top;
    tip.style.left = Math.min(x + 12, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.max(8, y - tip.offsetHeight - 10) + 'px';
  };
  node.addEventListener('mousemove', show);
  node.addEventListener('focus', () => show());
  node.addEventListener('mouseleave', () => tip.style.opacity = 0);
  node.addEventListener('blur', () => tip.style.opacity = 0);
  addEventListener('scroll', () => tip.style.opacity = 0, { passive: true });
}

/* sync: when sync_url is set, checkmarks and notes are kept in the Google Sheet via Apps Script.
   This browser's storage is a cache so the page works offline. */
const SYNC = S.sync_url || '';
async function push(msg) {
  if (!SYNC) return null;
  try {
    const r = await fetch(SYNC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(msg) });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
async function pull() {
  if (!SYNC) return null;
  try { const r = await fetch(SYNC); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

/* shared numbers */
const G = S.goal;
const current = DATA.history[DATA.history.length - 1].squad1;
const climb = Math.max(0, Math.min(1, (current - G.baseline) / (G.target - G.baseline)));
const ofTarget = current / G.target;
const allSteps = S.plan.flatMap(p => p.steps.map(s => Object.assign(s, { phase: p.phase, base: s.status })));
/* checkmarks are saved in this browser; the published data is the starting point */
const STORE = 'lw-done';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
const undone = s => s.base === 'done' ? 'todo' : s.base;
/* a step with "subs" (several heroes or parts) is done when every sub-step is done */
const allSubs = allSteps.flatMap(s => (s.subs || []).map(u => Object.assign(u, { parent: s, base: u.status || 'todo' })));
function applySaved() {
  allSubs.forEach(u => { u.status = u.id in saved ? (saved[u.id] ? 'done' : undone(u)) : u.base; });
  allSteps.forEach(s => {
    if (s.subs && s.subs.length) s.status = s.subs.every(u => u.status === 'done') ? 'done' : undone(s);
    else s.status = s.id in saved ? (saved[s.id] ? 'done' : undone(s)) : s.base;
  });
}
applySaved();
function setCheck(id, done) {
  saved[id] = done;
  push({ action: 'check', id, done });
}
function toggleStep(id) {
  const s = allSteps.find(x => x.id === id) || allSubs.find(x => x.id === id);
  if (!s) return;
  const done = s.status !== 'done';
  if (s.subs && s.subs.length) { s.subs.forEach(u => { if ((u.status === 'done') !== done) setCheck(u.id, done); }); openSubs.add(s.id); }
  else setCheck(id, done);
  applySaved();
  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
  const y = scrollY;
  renderPlan(); renderProgress();
  scrollTo(0, y);
  const again = document.querySelector(`.chk[data-id="${id}"]`);
  if (again) again.focus({ preventScroll: true });
}
const activePhaseNow = () => (S.plan.find(p => p.steps.some(s => s.status !== 'done')) || S.plan[S.plan.length - 1]).phase;

function planBar() {
  const order = Object.keys(TYPE).filter(t => allSteps.some(s => s.type === t));
  const steps = order.flatMap(t => allSteps.filter(s => s.type === t));
  const done = allSteps.filter(s => s.status === 'done').length;
  return `<div class="pbar-head"><div class="goal-title" style="margin:0">${ico('plan')}Game plan · ${done} of ${allSteps.length} steps done</div><span class="pct">${Math.round(done / allSteps.length * 100)}%</span></div>
    <div class="pbar${filterType ? ' filtering' : ''}" role="img" aria-label="${done} of ${allSteps.length} plan steps done">${steps.map(s =>
      `<span class="seg${s.status === 'done' ? ' on' : ''}${filterType === s.type ? ' match' : ''}" style="--tc:${typeColor(s.type)}" data-tip="${esc(TYPE[s.type][0] + ': ' + s.title + (s.status === 'done' ? ' (done)' : ''))}"></span>`).join('')}</div>
    <div class="pbar-legend${filterType ? ' filtering' : ''}" role="group" aria-label="Filter plan steps by type">${order.map(t => {
      const a = allSteps.filter(s => s.type === t), d = a.filter(s => s.status === 'done').length;
      return `<button type="button" class="chip fbtn" data-type="${t}" aria-pressed="${filterType === t}" style="--tc:${typeColor(t)}">${ico(t)}${TYPE[t][0]} <b>${d}/${a.length}</b></button>`;
    }).join('')}${filterType ? `<button type="button" class="chip fbtn fclear" data-type="">${ico('close')}Show all</button>` : ''}</div>`;
}
let filterType = null;
function setFilter(t) {
  filterType = t && t !== filterType ? t : null;
  if ((location.hash || '#plan') !== '#plan') { location.hash = '#plan'; }
  const y = scrollY;
  renderPlan(); renderProgress();
  scrollTo(0, y);
}
document.addEventListener('click', e => { const b = e.target.closest('.fbtn'); if (b) setFilter(b.dataset.type); });
function bindSegs(root) { root.querySelectorAll('.seg').forEach(g => { bindTip(g, esc(g.dataset.tip)); g.tabIndex = -1; }); }

/* ---------- Game plan ---------- */
const openSubs = new Set();
function subList(s) {
  if (!s.subs || !s.subs.length) return '';
  const d = s.subs.filter(u => u.status === 'done').length;
  return `<details class="subs" data-for="${esc(s.id)}"${openSubs.has(s.id) ? ' open' : ''}><summary>${d} of ${s.subs.length} done · details</summary>${s.subs.map(u => {
    const ud = u.status === 'done';
    return `<div class="sub ${u.status}"><button class="chk sm" type="button" role="checkbox" aria-checked="${ud}" data-id="${esc(u.id)}" aria-label="${esc(u.title)}: mark ${ud ? 'not done' : 'done'}">${ud ? ico('check') : ''}</button>
      <div><div class="st">${esc(u.title)}</div>${u.hero || u.cost ? `<div class="meta">${u.hero ? heroChip(u.hero) : ''}${costChip(u.cost)}</div>` : ''}</div></div>`;
  }).join('')}</details>`;
}
function stepCard(s) {
  const done = s.status === 'done';
  return `<div class="step ${s.status}" style="--tc:${typeColor(s.type)}">
    <button class="chk" type="button" role="checkbox" aria-checked="${done}" data-id="${esc(s.id)}" aria-label="${esc(s.title)}: mark ${done ? 'not done' : 'done'}">${done ? ico('check') : ''}</button>
    <div class="tile" title="${esc((TYPE[s.type] || ['Other'])[0])}">${ico(s.type)}</div>
    <div><div class="ttl">${esc(s.title)}</div>${s.detail ? `<div class="dt">${esc(s.detail)}</div>` : ''}
      <div class="meta">${s.hero ? heroChip(s.hero) : ''}${costChip(s.cost)}</div>${subList(s)}</div>
  </div>`;
}
function renderPlan() {
  const v = document.getElementById('v-plan');
  const activePhase = activePhaseNow();
  v.innerHTML = `
    <div class="card bare">
      <div class="goal-title">${ico('progress')}${esc(G.name)} · ${esc(G.rule)}</div>
      <div class="power-line goal-nums"><span class="big">${fmtM(current)}</span><span class="arrow">${ico('arrow')}</span><span class="big">${fmtM(G.target)}</span>
        <span class="chip">${ico('trend')}+${fmtM(Math.max(0, G.target - current))} to go</span></div>
      ${planBar()}
    </div>

    <div class="card"><div class="stepper">${S.plan.map(p => {
      const done = p.steps.every(s => s.status === 'done');
      const cls = done ? 'done' : p.phase === activePhase ? 'active' : '';
      return `<button class="ph ${cls}" type="button" data-jump="phase-${p.phase}">
        <div class="dot">${done ? ico('check') : p.phase}</div>
        <div class="nm">${esc(p.name)}</div><div class="mt">${p.steps.length ? esc(p.window) + ' · ' + esc(p.estimate) : 'Completed'}</div></button>`;
    }).join('')}</div></div>

    <h2 class="sec">${ico('plan')}Phases</h2>
    <div class="hint">${ico('check')}Tick a box when a step is done.${SYNC ? '' : ' Saved on this device.'}</div>
    ${filterType ? `<div class="hint">${ico(filterType)}Showing ${TYPE[filterType][0].toLowerCase()} steps only.</div>` : ''}
    ${S.plan.map(p => {
      const shown = p.steps.filter(s => !filterType || s.type === filterType);
      if (!p.steps.length) return '';
      if (!shown.length) return '';
      const done = p.steps.filter(s => s.status === 'done').length;
      return `<div class="card" id="phase-${p.phase}">
        <div class="phase-head">
          <h3><span class="badge">${p.phase}</span>${esc(p.name)}</h3>
          <div class="chips"><span class="chip">${ico('clock')}${esc(p.window)}</span><span class="chip">${ico('trend')}${esc(p.estimate)}</span>
            <span class="prog" title="${done} of ${p.steps.length} done"><span class="t"><i style="width:${(done / p.steps.length * 100).toFixed(0)}%"></i></span>${done}/${p.steps.length}</span></div>
        </div>
        <div class="steps">${shown.map(stepCard).join('')}</div>
      </div>`;
    }).join('')}

    <h2 class="sec">${ico('recaps')}Playbook</h2>
    <div class="rules">${S.rules.map(r => `<div class="rule"><div class="tile">${ico(r.icon)}</div><div>${esc(r.text)}</div></div>`).join('')}</div>`;
  v.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => document.getElementById(b.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }));
  v.querySelectorAll('.chk').forEach(b => b.onclick = () => toggleStep(b.dataset.id));
  v.querySelectorAll('details.subs').forEach(d => d.ontoggle = () => { if (d.open) openSubs.add(d.dataset.for); else openSubs.delete(d.dataset.for); });
  bindSegs(v);
}

/* ---------- Goal progress ---------- */
function renderProgress() {
  const v = document.getElementById('v-progress');
  const doneSteps = allSteps.filter(s => s.status === 'done').length;
  v.innerHTML = `
    <div class="card">
      <div>
        <div class="goal-title">${ico('progress')}${esc(G.name)}</div>
        <div class="stats">
          <div class="stat"><div class="l">${ico('power')}Squad 1 now</div><div class="v">${fmtM(current)}</div></div>
          <div class="stat"><div class="l">${ico('flag')}Target</div><div class="v">${fmtM(G.target)}</div></div>
          <div class="stat"><div class="l">${ico('trend')}Still needed</div><div class="v">+${fmtM(Math.max(0, G.target - current))}</div></div>
          <div class="stat"><div class="l">${ico('plan')}Steps done</div><div class="v">${doneSteps}/${allSteps.length}</div></div>
          <div class="stat"><div class="l">${ico('check')}Completed earlier</div><div class="v">${ARCHIVE.reduce((n, a) => n + a.steps.length, 0)}</div></div>
        </div>
        ${planBar()}
      </div>
    </div>
    <div class="card">
      <div class="goal-title">${ico('flag')}Milestones</div>
      <div class="meter"><div class="meter-track" id="meter"></div><div class="ticks" id="ticks"></div></div>
    </div>
    <div class="card">
      <div class="goal-title">${ico('trend')}Squad 1 power by recording</div>
      <div id="history"></div>
    </div>`;
  const meter = v.querySelector('#meter'), ticks = v.querySelector('#ticks');
  const lo = G.baseline, span = G.target - lo, pos = x => ((x - lo) / span * 100).toFixed(2) + '%';
  meter.innerHTML = `<div class="meter-fill" style="width:max(14px, ${pos(current)})"></div>`;
  ticks.innerHTML = `<span class="mchip"><b>${fmtM(G.baseline)}</b>Start</span>` +
    G.milestones.map((m, i) => {
      if (i < G.milestones.length - 1) meter.insertAdjacentHTML('beforeend', `<div class="tick" style="left:${pos(m.value)}"></div>`);
      const hit = current >= m.value;
      return `<span class="mchip${hit ? ' hit' : ''}"><b>${hit ? ico('check') : ''}${fmtM(m.value)}</b>${esc(m.label)}</span>`;
    }).join('');
  bindTip(meter, `Squad 1: <b>${fmtM(current)}</b> of ${fmtM(G.target)}<br>Started at ${fmtM(G.baseline)}`);
  bindSegs(v);

  const box = v.querySelector('#history');
  const pts = DATA.history.filter(h => h.squad1);
  if (pts.length < 2) {
    box.innerHTML = `<p class="empty">${ico('clock')}The line starts with the next recording. Starting point: ${fmtM(pts[0].squad1)} on ${fmtDate(pts[0].date)}.</p>`;
    return;
  }
  const W = 880, H = 220, L = 52, R = 16, T = 14, B = 28;
  const ys = pts.map(p => p.squad1).concat([G.target]);
  const ymin = Math.floor(Math.min(...ys) / 1e6) * 1e6, ymax = Math.ceil(Math.max(...ys) / 1e6) * 1e6;
  const t0 = +new Date(pts[0].date), t1 = +new Date(pts[pts.length - 1].date);
  const x = d => L + (W - L - R) * ((+new Date(d) - t0) / Math.max(1, t1 - t0));
  const y = val => T + (H - T - B) * (1 - (val - ymin) / (ymax - ymin));
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Squad 1 power by recording date">`;
  for (let k = 0; k <= 4; k++) {
    const val = ymin + (ymax - ymin) * k / 4, yy = y(val);
    svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${(val / 1e6).toFixed(0)}M</text>`;
  }
  svg += `<line x1="${L}" x2="${W - R}" y1="${y(G.target)}" y2="${y(G.target)}" stroke="var(--text-3)" stroke-dasharray="4 4"/><text x="${W - R}" y="${y(G.target) - 6}" text-anchor="end">Target</text>`;
  svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map(p => x(p.date) + ',' + y(p.squad1)).join(' ')}"/>`;
  pts.forEach(p => {
    svg += `<circle class="pt" data-d="${p.date}" cx="${x(p.date)}" cy="${y(p.squad1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    svg += `<text x="${x(p.date)}" y="${H - 8}" text-anchor="middle">${fmtDate(p.date).replace(/, \d{4}/, '')}</text>`;
  });
  box.innerHTML = svg + '</svg>' + `<details><summary>Show as table</summary><table class="data"><tr><th>Date</th><th>Squad 1</th><th>Total power</th></tr>${pts.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${fmtM(p.squad1)}</td><td>${p.total.toLocaleString()}</td></tr>`).join('')}</table></details>`;
  box.querySelectorAll('.pt').forEach(c => { const p = pts.find(q => q.date === c.dataset.d); bindTip(c, `${fmtDate(p.date)}<br>Squad 1: <b>${fmtM(p.squad1)}</b>`); });
}

  add('squad-bars', DATA.squads.map(s => ({
    label: 'Squad ' + s.n, value: s.power, sub: `<small>${esc(s.mix)}</small>`,
    tip: `<b>Squad ${s.n}</b>: ${fmtM(s.power)}<br>${s.heroes.map(esc).join(', ')}`
  })), Math.max(...DATA.squads.map(s => s.power)));
  const heroes = DATA.squad1.filter(h => h.power).sort((a, b) => b.power - a.power);
  const kim = (heroes.find(h => h.name === 'Kimberly') || heroes[0]).power;
  add('hero-bars', heroes.map(h => ({
    label: h.name, value: h.power, avatar: av(h.name),
    tip: `<b>${esc(h.name)}</b>: ${fmtM(h.power)}<br>${h.power >= kim ? 'Benchmark' : fmtM(kim - h.power) + ' behind Kimberly'}`
  })), kim * 1.05, kim);
}

/* ---------- Tank heroes ---------- */
const pic = n => `heroes/${n.toLowerCase()}.jpg`;
const cardArt = n => `heroes/${n.toLowerCase()}-card.jpg`;
const hc = n => `var(--h${(HEROES.indexOf(n) + 1) || 6})`;
const fmtK = v => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : Math.round(v / 1e3).toLocaleString() + 'K';
const shortDate = d => fmtDate(d).replace(/, \d{4}/, '');
function delta(v, unit) {
  if (v == null) return '';
  const cls = v > 0 ? 'up' : v < 0 ? 'down' : '';
  const txt = unit ? (v > 0 ? '+' : '') + v + unit : (v > 0 ? '+' : v < 0 ? '−' : '') + fmtK(Math.abs(v));
  return `<span class="delta ${cls}">${v ? ico('trend') : ''}${txt}</span>`;
}
function renderHeroes() {
  const v = document.getElementById('v-heroes');
  const T = DATA.tanks || [];
  if (!T.length) { v.innerHTML = ''; return; }
  const dates = T[0].history.map(h => h.date);
  const first = dates[0], last = dates[dates.length - 1];
  const pw = (t, d) => (t.history.find(h => h.date === d) || {}).power;
  const sumAt = d => T.reduce((n, t) => n + (pw(t, d) || 0), 0);
  const ordered = T.slice().sort((a, b) => pw(b, last) - pw(a, last));
  v.innerHTML = `
    <div class="card">
      <div class="goal-title">${ico('hero')}Squad 1 tank heroes</div>
      <div class="stats">
        <div class="stat"><div class="l">${ico('power')}Five tanks now</div><div class="v">${fmtM(sumAt(last))}</div></div>
        <div class="stat"><div class="l">${ico('trend')}Since ${shortDate(first)}</div><div class="v">+${fmtK(sumAt(last) - sumAt(first))}</div></div>
        <div class="stat"><div class="l">${ico('clock')}Last week</div><div class="v">+${fmtK(sumAt(last) - sumAt(dates[dates.length - 2] || first))}</div></div>
        <div class="stat"><div class="l">${ico('flag')}Recordings</div><div class="v">${dates.length}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="goal-title">${ico('trend')}Power gained since ${shortDate(first)}</div>
      <div class="hlegend">${ordered.map(t => `<span style="--hc:${hc(t.name)}"><img src="${pic(t.name)}" alt="">${esc(t.name)}</span>`).join('')}</div>
      <div class="chart-wrap" id="hero-line"></div>
    </div>
    <div class="card">
      <div class="goal-title">${ico('hero')}Your hand · tap a card to read it</div>
      <div class="hand" role="list">${ordered.map((tk, i, arr) => {
        const mid = (arr.length - 1) / 2, off = i - mid;
        return `<button class="slot" type="button" role="listitem" data-hero="${esc(tk.name)}" style="--r:${(off * 6).toFixed(1)}deg;--y:calc(var(--hw) * ${(off * off * 0.035).toFixed(3)})" aria-label="${esc(tk.name)}, ${fmtM(tk.history[tk.history.length - 1].power)} power. Open card">${heroCard(tk)}</button>`;
      }).join('')}</div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="goal-title">${ico('power')}Account power by category</div>
      <div id="power-split"></div>
    </div>
    ${DATA.hero_split && DATA.hero_split.length ? `<div class="card"><div class="goal-title">${ico('hero')}Where hero power comes from (all heroes)</div><div id="hero-split"></div></div>` : ''}`;

  /* line chart: power gained since the first recording, one line per tank, labelled at the right end */
  const box = v.querySelector('#hero-line');
  const W = 640, H = 250, L = 46, R = 112, Tp = 14, B = 28;
  const gain = (t, d) => pw(t, d) != null && pw(t, first) != null ? pw(t, d) - pw(t, first) : null;
  const vals = T.flatMap(t => dates.map(d => gain(t, d)).filter(g => g != null));
  const step = 1e5, ymin = Math.min(0, Math.floor(Math.min(...vals) / step) * step), ymax = Math.ceil(Math.max(...vals) / step) * step;
  const t0 = +new Date(first), t1 = +new Date(last);
  const x = d => L + (W - L - R) * ((+new Date(d) - t0) / Math.max(1, t1 - t0));
  const y = val => Tp + (H - Tp - B) * (1 - (val - ymin) / (ymax - ymin));
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Power gained by each tank hero since ${fmtDate(first)}">`;
  for (let val = ymin; val <= ymax + 1; val += step) {
    const yy = y(val);
    svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${val === 0 ? 'var(--text-3)' : 'var(--border)'}"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${val ? '+' + Math.round(val / 1e3) + 'K' : '0'}</text>`;
  }
  dates.forEach(d => { svg += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${shortDate(d)}</text>`; });
  svg += `<line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H - B}"/>`;
  /* end labels, nudged apart so they never overlap */
  const ends = T.map(t => ({ t, y: y(gain(t, last)) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 16) ends[i].y = ends[i - 1].y + 16;
  T.forEach(t => {
    const pts = dates.filter(d => gain(t, d) != null);
    svg += `<polyline fill="none" stroke="${hc(t.name)}" stroke-width="2" points="${pts.map(d => x(d) + ',' + y(gain(t, d))).join(' ')}"/>`;
    pts.forEach(d => { svg += `<circle cx="${x(d)}" cy="${y(gain(t, d))}" r="4.5" fill="${hc(t.name)}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  ends.forEach(e => { svg += `<text x="${x(last) + 12}" y="${e.y + 4}" style="fill:var(--text)">${esc(e.t.name)} <tspan style="fill:var(--text-2)">+${fmtK(gain(e.t, last))}</tspan></text>`; });
  dates.forEach((d, i) => {
    const a = i ? (x(dates[i - 1]) + x(d)) / 2 : L, b = i < dates.length - 1 ? (x(d) + x(dates[i + 1])) / 2 : W - R + 10;
    svg += `<rect class="hit" data-d="${d}" x="${a}" y="${Tp}" width="${b - a}" height="${H - Tp - B}"/>`;
  });
  box.innerHTML = svg + '</svg>' + `<details><summary>Show as table</summary><table class="data"><tr><th>Hero</th>${dates.map(d => `<th class="num">${shortDate(d)}</th>`).join('')}<th class="num">Gained</th></tr>${ordered.map(t => `<tr><td>${esc(t.name)}</td>${dates.map(d => `<td class="num">${pw(t, d) ? fmtM(pw(t, d)) : '–'}</td>`).join('')}<td class="num">+${fmtK(gain(t, last))}</td></tr>`).join('')}</table></details>`;
  const xh = box.querySelector('.xh');
  box.querySelectorAll('.hit').forEach(r => {
    const d = r.dataset.d;
    bindTip(r, `<b>${fmtDate(d)}</b><br>${ordered.map(t => `${esc(t.name)}: ${pw(t, d) ? fmtM(pw(t, d)) : '–'}${d !== first && gain(t, d) != null ? ` (+${fmtK(gain(t, d))})` : ''}`).join('<br>')}`);
    const on = () => { xh.setAttribute('x1', x(d)); xh.setAttribute('x2', x(d)); xh.style.opacity = 1; };
    r.addEventListener('mouseenter', on); r.addEventListener('focus', on);
    r.addEventListener('mouseleave', () => xh.style.opacity = 0); r.addEventListener('blur', () => xh.style.opacity = 0);
  });

  /* category tables: every recording side by side, change since the one before */
  /* newest recording first, then % change vs last week and vs a month ago, then older recordings */
  const catTable = (rows, cats) => {
    const now = rows[rows.length - 1], lw = rows[rows.length - 2];
    const target = +new Date(now.date) - 30 * 864e5;
    /* the recording closest to 30 days back; until there's a month of history that's the first one */
    const mo = rows.length > 1 ? rows.slice(0, -1).reduce((best, r) => Math.abs(+new Date(r.date) - target) < Math.abs(+new Date(best.date) - target) ? r : best) : null;
    const pct = (k, base) => {
      if (!base || base[k] == null || now[k] == null || !base[k]) return '<span class="delta">–</span>';
      const p = (now[k] - base[k]) / base[k] * 100, cls = p > 0.05 ? 'up' : p < -0.05 ? 'down' : '';
      return `<span class="delta ${cls}">${cls ? ico('trend') : ''}${p > 0 ? '+' : p < 0 ? '−' : ''}${Math.abs(p).toFixed(1)}%</span>`;
    };
    const older = rows.slice(0, -1).reverse();
    const sub = r => r ? `<small class="th-sub">vs ${shortDate(r.date)}</small>` : '';
    return `<div class="tscroll"><table class="data"><tr><th>Category</th><th class="num">${shortDate(now.date)}</th>
      <th class="num">Last week${sub(lw)}</th><th class="num">Month${sub(mo)}</th>${older.map(r => `<th class="num old">${shortDate(r.date)}</th>`).join('')}</tr>${cats.map(([k, label]) =>
      `<tr><td>${label}</td><td class="num"><b>${now[k] != null ? fmtM(now[k]) : '–'}</b></td><td class="num">${pct(k, lw)}</td><td class="num">${pct(k, mo)}</td>${older.map(r => `<td class="num old">${r[k] != null ? fmtM(r[k]) : '–'}</td>`).join('')}</tr>`
    ).join('')}</table></div>`;
  };
  v.querySelector('#power-split').innerHTML = catTable(DATA.power_split, [['hero_power', 'Hero'], ['unit_power', 'Unit (troops)'], ['building_power', 'Building'], ['drone_power', 'Drone'], ['tech_power', 'Tech'], ['overlord_power', 'Overlord']]);
  const hs = v.querySelector('#hero-split');
  if (hs) hs.innerHTML = catTable(DATA.hero_split, [['hero_level', 'Hero level'], ['decor_building_stats', 'Decor & building stats'], ['gear', 'Gear'], ['skill', 'Skills'], ['tier', 'Tier'], ['exclusive_weapon', 'Exclusive Weapon'], ['wall_of_honor', 'Wall of Honor']]);
}
/* Each Squad 1 tank gets one card colour; the dot in the set-symbol spot is its chart colour. */
const CARD_COLOR = { Murphy: 'W', Williams: 'G', Kimberly: 'R', Stetmann: 'U', Marshall: 'B' };
function heroCard(t) {
  const h = t.history, now = h[h.length - 1], prev = h[h.length - 2] || now, start = h[0];
  const trail = (f, fmt = String) => {
    const seen = [];
    h.forEach(r => { const val = f(r); if (val != null && seen[seen.length - 1] !== val) seen.push(val); });
    return seen.length ? seen.map(fmt).join('<span class="arrow">→</span>') : null;
  };
  const ew = trail(r => r.ew, s => 'Lv ' + s), honor = trail(r => r.honor);
  const skills = [0, 1, 2].map(i => trail(r => r.skills ? r.skills[i] : null)).join(' · ');
  const sign = v => (v >= 0 ? '+' : '−') + fmtK(Math.abs(v));
  return `<div class="mtg" data-c="${CARD_COLOR[t.name] || 'W'}" style="--hc:${hc(t.name)}">
    <div class="frame">
      <div class="bar"><span class="name">${esc(t.name)}</span><span class="cost" aria-label="5 stars">${'<span class="pip">★</span>'.repeat(5)}</span></div>
      <div class="art"><img src="${cardArt(t.name)}" alt="" loading="lazy"></div>
      <div class="bar"><span class="type">Legendary Hero — ${esc(t.role)} Tank</span><span class="set" title="Chart colour"></span></div>
      <div class="text">
        <div><b>Exclusive Weapon</b> — ${ew || 'Not unlocked yet.'}</div>
        <div><b>Wall of Honor</b> — ${honor || '–'}</div>
        <div><b>Skills</b> — ${skills}</div>
        <div><b>Defense</b> ${esc(t.defense)}</div>
        <hr>
        <div class="flavor">${sign(now.power - prev.power)} last week, ${sign(now.power - start.power)} since ${shortDate(start.date)}.</div>
      </div>
      <div class="pt" title="Attack / HP">${esc(t.attack)}/${esc(t.hp)}</div>
    </div>
    <div class="foot"><span>★ ${fmtM(now.power)} power</span><span>Squad 1 · ${shortDate(now.date)}</span></div>
  </div>`;
}
function openCard(name) {
  const T = (DATA.tanks || []).slice().sort((a, b) => b.history[b.history.length - 1].power - a.history[a.history.length - 1].power);
  let i = Math.max(0, T.findIndex(t => t.name === name));
  let pop = document.getElementById('card-pop');
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'card-pop'; pop.className = 'pop';
    pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-modal', 'true');
    document.body.append(pop);
  }
  const back = document.activeElement;
  const close = () => { pop.classList.remove('on'); removeEventListener('keydown', key); if (back) back.focus({ preventScroll: true }); };
  const show = () => {
    pop.setAttribute('aria-label', T[i].name + ' card');
    pop.innerHTML = `<div class="inner">${heroCard(T[i])}<div class="ctl">
      <button class="prev" type="button">${ico('arrow')}Previous</button><button class="x" type="button">${ico('close')}Close</button><button class="next" type="button">Next${ico('arrow')}</button></div></div>`;
    pop.querySelector('.prev').onclick = () => { i = (i + T.length - 1) % T.length; show(); };
    pop.querySelector('.next').onclick = () => { i = (i + 1) % T.length; show(); };
    pop.querySelector('.x').onclick = close;
    pop.querySelector('.x').focus({ preventScroll: true });
  };
  const key = e => {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') { i = (i + 1) % T.length; show(); }
    else if (e.key === 'ArrowLeft') { i = (i + T.length - 1) % T.length; show(); }
  };
  pop.onclick = e => { if (e.target === pop) close(); };
  addEventListener('keydown', key);
  pop.classList.add('on');
  show();
}
document.addEventListener('click', e => { const s = e.target.closest('.hand .slot'); if (s) openCard(s.dataset.hero); });

/* ---------- Notes ---------- */
/* Notes live in this browser's storage, like the plan checkmarks. */
const NOTES = 'lw-notes', DRAFT = 'lw-note-draft';
const loadNotesData = () => { try { return JSON.parse(localStorage.getItem(NOTES) || '[]'); } catch (e) { return []; } };
const saveNotesData = n => { try { localStorage.setItem(NOTES, JSON.stringify(n)); } catch (e) {} };
const noteDate = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
function renderNotes() {
  const v = document.getElementById('v-notes');
  let draft = '';
  try { draft = localStorage.getItem(DRAFT) || ''; } catch (e) {}
  const notes = loadNotesData();
  const open = notes.filter(n => !n.reviewed), done = notes.filter(n => n.reviewed);
  const card = n => `<div class="note${n.reviewed ? ' reviewed' : ''}">
      <div class="tile" style="--tc:${n.reviewed ? 'var(--good)' : 'var(--accent)'}">${ico(n.reviewed ? 'check' : 'note')}</div>
      <div><p>${esc(n.text)}</p><div class="when">${noteDate(n.at)}${n.reviewed ? ' · reviewed ' + noteDate(n.reviewed) : ''}</div>
        <div class="note-row" style="justify-content:flex-start;margin-top:8px">
          <button class="btn ghost sm" type="button" data-act="toggle" data-id="${n.id}">${ico(n.reviewed ? 'arrow' : 'check')}${n.reviewed ? 'Move back' : 'Mark reviewed'}</button>
          <button class="btn ghost sm" type="button" data-act="del" data-id="${n.id}">${ico('close')}Delete</button>
        </div></div></div>`;
  v.innerHTML = `
    <div class="card note-form">
      <div class="goal-title">${ico('note')}Add a note for the next analysis</div>
      <textarea id="note-text" placeholder="e.g. Murphy's weapon took the universal shards; check his power next recording" aria-label="Note">${esc(draft)}</textarea>
      <div class="note-row">
        <span class="hint" style="margin:0">${ico('check')}${SYNC ? 'Saved to your analysis sheet.' : 'Saved on this device.'}</span>
        <button class="btn" id="note-add" type="button">${ico('note')}Add note</button>
      </div>
    </div>
    <div class="phase-head" style="margin:24px 0 10px"><h2 class="sec" style="margin:0">${ico('clock')}To consider next analysis</h2>
      ${open.length ? `<button class="btn ghost sm" id="note-copy" type="button">${ico('recaps')}Copy all</button>` : ''}</div>
    <div class="notes-list">${open.length ? open.map(card).join('') : `<p class="empty">${ico('check')}No notes waiting.</p>`}</div>
    <h2 class="sec">${ico('check')}Reviewed</h2>
    <div class="notes-list">${done.length ? done.map(card).join('') : `<p class="empty">${ico('clock')}Nothing reviewed yet.</p>`}</div>`;
  const ta = v.querySelector('#note-text'), add = v.querySelector('#note-add');
  const sync = () => { add.disabled = !ta.value.trim(); try { localStorage.setItem(DRAFT, ta.value); } catch (e) {} };
  ta.oninput = sync; sync();
  add.onclick = () => {
    const text = ta.value.trim();
    if (!text) return;
    const all = loadNotesData();
    const note = { id: Date.now().toString(36), text, at: Date.now(), reviewed: null };
    all.unshift(note);
    saveNotesData(all);
    push({ action: 'note-add', id: note.id, text });
    try { localStorage.removeItem(DRAFT); } catch (e) {}
    renderNotes();
  };
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    let all = loadNotesData();
    if (b.dataset.act === 'del') {
      if (!confirm('Delete this note?')) return;
      all = all.filter(n => n.id !== b.dataset.id);
      push({ action: 'note-delete', id: b.dataset.id });
    } else {
      all = all.map(n => n.id === b.dataset.id ? { ...n, reviewed: n.reviewed ? null : Date.now() } : n);
      push({ action: 'note-review', id: b.dataset.id, reviewed: !!all.find(n => n.id === b.dataset.id).reviewed });
    }
    saveNotesData(all);
    renderNotes();
  });
  const copy = v.querySelector('#note-copy');
  if (copy) copy.onclick = async () => {
    const txt = open.map(n => `- (${noteDate(n.at)}) ${n.text}`).join('\n');
    try { await navigator.clipboard.writeText(txt); copy.innerHTML = ico('check') + 'Copied'; }
    catch (e) { prompt('Copy your notes:', txt); }
  };
}

/* ---------- shell: menu, routing, theme ---------- */
const VIEWS = [
  { id: 'plan', name: 'Game plan', icon: 'plan' },
  { id: 'progress', name: 'Goal progress', icon: 'progress' },
  { id: 'recaps', name: 'Recaps', icon: 'recaps' },
  { id: 'squads', name: 'Squads', icon: 'squads' },
  { id: 'heroes', name: 'Tank heroes', icon: 'hero' },
  { id: 'done', name: 'Completed', icon: 'check' },
  { id: 'notes', name: 'Notes', icon: 'note' }
];
document.getElementById('title').textContent = S.title;
document.getElementById('updated').textContent = S.commander + ' · Updated ' + fmtDate(DATA.updated);
document.getElementById('menu-btn').innerHTML = ico('menu');
document.getElementById('close-btn').innerHTML = ico('close');
document.getElementById('nav-links').innerHTML = VIEWS.map(v => `<a href="#${v.id}" data-v="${v.id}">${ico(v.icon)}${v.name}</a>`).join('');
renderPlan(); renderProgress(); renderRecaps(); renderSquads(); renderHeroes(); renderDone(); renderNotes();
pull().then(st => {
  if (!st) return;
  saved = st.checks || {};
  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
  applySaved();
  saveNotesData(st.notes || []);
  const y = scrollY;
  renderPlan(); renderProgress(); renderNotes();
  scrollTo(0, y);
});
document.getElementById('foot').textContent += ' Site version: ' + DATA.built + '.';

const menuBtn = document.getElementById('menu-btn');
function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', open);
  if (open) (document.querySelector('#nav-links a[aria-current]') || document.querySelector('#nav-links a')).focus({ preventScroll: true });
}
menuBtn.onclick = () => setMenu(true);
document.getElementById('close-btn').onclick = () => { setMenu(false); menuBtn.focus({ preventScroll: true }); };
document.getElementById('scrim').onclick = () => setMenu(false);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { setMenu(false); menuBtn.focus({ preventScroll: true }); } });

function route() {
  const id = (location.hash || '#plan').slice(1);
  const view = VIEWS.find(v => v.id === id) || VIEWS[0];
  VIEWS.forEach(v => document.getElementById('v-' + v.id).classList.toggle('on', v === view));
  document.querySelectorAll('#nav-links a').forEach(a => {
    if (a.dataset.v === view.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  document.getElementById('crumb').textContent = view.name;
  document.title = view.name + ' · ' + S.title;
  setMenu(false);
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();

(function () {
  const root = document.documentElement, btn = document.getElementById('theme');
  try { const t = localStorage.getItem('lw-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const paint = () => { btn.innerHTML = ico(isDark() ? 'season' : 'moon'); };
  btn.onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('lw-theme', root.dataset.theme); } catch (e) {} paint(); };
  paint();
})();
</script>
