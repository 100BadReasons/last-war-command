<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last War Command</title>
<meta name="description" content="Game plan, goal progress and recaps for my Last War account.">
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #efeee9; --border: #dddcd5;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #75746f;
  --accent: #2a78d6; --track: #e6e5df; --good: #0ca30c; --good-text: #006300;
  --c-skill: #2a78d6; --c-gear: #eb6834; --c-research: #1baf7a; --c-honor: #eda100;
  --c-season: #e87ba4; --c-drone: #008300; --c-weapon: #4a3aa7;
  --h1: #2a78d6; --h2: #eb6834; --h3: #1baf7a; --h4: #4a3aa7; --h5: #e34948; --h6: #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f;
    --accent: #3987e5; --track: #2c2c29; --good-text: #5fd35f;
    --c-skill: #3987e5; --c-gear: #d95926; --c-research: #199e70; --c-honor: #c98500;
    --c-season: #d55181; --c-drone: #008300; --c-weapon: #9085e9;
    --h1: #3987e5; --h2: #d95926; --h3: #199e70; --h4: #9085e9; --h5: #e66767; --h6: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f;
  --accent: #3987e5; --track: #2c2c29; --good-text: #5fd35f;
  --c-skill: #3987e5; --c-gear: #d95926; --c-research: #199e70; --c-honor: #c98500;
  --c-season: #d55181; --c-drone: #008300; --c-weapon: #9085e9;
  --h1: #3987e5; --h2: #d95926; --h3: #199e70; --h4: #9085e9; --h5: #e66767; --h6: #d55181;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; }

/* top bar + drawer */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; color: var(--text); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; flex: 1; }
.brand b { font-size: 16px; }
.brand span { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 19; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: 272px; max-width: 84vw; background: var(--surface);
  border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform .22s ease; z-index: 20;
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; visibility: hidden;
}
body.menu-open .drawer { transform: none; visibility: visible; }
body.menu-open .scrim { opacity: 1; pointer-events: auto; }
.drawer .head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
.drawer .head b { font-size: 16px; }
.drawer a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px;
  color: var(--text); text-decoration: none; font-weight: 550;
}
.drawer a:hover { background: var(--surface-2); }
.drawer a[aria-current="page"] { background: var(--surface-2); color: var(--accent); }
.drawer .foot { margin-top: auto; color: var(--text-3); font-size: 12px; padding: 8px 12px; }

main.wrap { padding-top: 24px; padding-bottom: 8px; }
.view { display: none; }
.view.on { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; scroll-margin-top: 72px; }
.card.bare { background: none; border: 0; padding: 0 0 8px; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.chip svg.i { width: 14px; height: 14px; }

/* goal strip */
.pbar-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
.pbar-head .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
.pbar { display: flex; gap: 3px; height: 18px; margin: 8px 0 10px; }
.seg { flex: 1; border-radius: 4px; background: color-mix(in srgb, var(--tc) 22%, transparent); transition: background .2s; }
.seg.on { background: var(--tc); }
.pbar-legend { display: flex; gap: 6px; flex-wrap: wrap; }
.pbar-legend .chip svg.i { color: var(--tc); }
.pbar-legend .chip b { color: var(--text); font-variant-numeric: tabular-nums; }
.fbtn { border: 1px solid transparent; cursor: pointer; font-size: 12px; transition: opacity .15s, background .15s; }
.fbtn:hover { border-color: var(--tc, var(--border)); }
.fbtn[aria-pressed="true"] { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 18%, transparent); color: var(--text); }
.filtering .fbtn[aria-pressed="false"] { opacity: .55; }
.filtering .seg:not(.match) { opacity: .25; }
.fclear { background: none; border: 1px dashed var(--border); }
.power-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.goal-nums { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.goal-nums .big { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.goal-nums .arrow { color: var(--text-3); display: flex; }
.goal-title { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; margin-bottom: 4px; }
.goal .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* phase stepper */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); }
.stepper .ph { text-align: center; padding: 0 6px; position: relative; cursor: pointer; border: 0; background: none; }
.stepper .ph::before { content: ""; position: absolute; top: 22px; left: -50%; width: 100%; height: 3px; background: var(--track); }
.stepper .ph:first-child::before { display: none; }
.stepper .ph.done + .ph::before, .stepper .ph.active::before { background: var(--accent); }
.stepper .ph.active ~ .ph::before { background: var(--track); }
.dot { position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; font-weight: 700; font-size: 17px; background: var(--surface); border: 3px solid var(--track); color: var(--text-2); }
.ph.active .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 15%, transparent); }
.ph.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.ph .nm { font-weight: 600; font-size: 14px; }
.ph .mt { color: var(--text-3); font-size: 12px; }

.dt { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }

/* step cards */
.phase-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.phase-head h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 10px; }
.badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; }
.phase-head .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.prog .t { width: 70px; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.prog .t i { display: block; height: 100%; background: var(--good); }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.step { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 12px; background: var(--surface-2); position: relative; }
.tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, transparent); flex: none; }
.tile svg.i { width: 22px; height: 22px; }
.step .ttl { font-weight: 600; line-height: 1.3; padding-right: 22px; }
.step .meta { margin-top: 8px; }
.step .meta .chip, .step .meta .hero { background: var(--surface); }
.hero { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text); background: var(--surface-2); border-radius: 999px; padding: 2px 9px 2px 2px; }
.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; background: var(--hc); flex: none; }
.step.done { opacity: .6; }
.step.done .ttl { text-decoration: line-through; text-decoration-color: var(--text-3); }
.chk { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--text-3); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; color: #fff; }
.chk:hover { border-color: var(--good); }
.chk[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.chk svg.i { width: 16px; height: 16px; stroke-width: 3; }
.step .ttl { padding-right: 30px; }
.hint { color: var(--text-3); font-size: 12px; margin: -4px 0 12px; display: flex; align-items: center; gap: 6px; }
.hint svg.i { width: 14px; height: 14px; }
.legend-types { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin: 0 0 12px; }
.legend-types span { display: inline-flex; align-items: center; gap: 5px; }
.legend-types span svg.i { width: 15px; height: 15px; color: var(--tc); }

/* playbook */
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.rule { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.rule .tile { width: 34px; height: 34px; border-radius: 10px; --tc: var(--accent); }
.rule .tile svg.i { width: 18px; height: 18px; }

/* stats + bars */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.stat .l { color: var(--text-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.stat .l svg.i { width: 15px; height: 15px; }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.meter { margin-top: 16px; }
.meter-track { position: relative; height: 14px; background: var(--track); border-radius: 7px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 7px; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--surface); }
.ticks { position: relative; height: 34px; margin-top: 6px; font-size: 12px; color: var(--text-2); }
.ticks span { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.ticks span b { display: block; color: var(--text); }
.bars { display: grid; gap: 12px; margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 64px; align-items: center; gap: 10px; }
.bar-row .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.bar-row .nm small { display: block; color: var(--text-3); font-weight: 400; font-size: 12px; }
.bar-track { height: 18px; position: relative; }
.bar { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-row:hover .bar, .bar-row:focus-visible .bar { filter: brightness(1.12); }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.bench { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--text-3); }

/* recaps */
.tl { position: relative; padding-left: 28px; }
.tl::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl .card { position: relative; }
.tl .card::before { content: ""; position: absolute; left: -25px; top: 20px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.recap .date { color: var(--accent); font-size: 13px; font-weight: 700; }
.recap h3 { margin: 2px 0 12px; font-size: 18px; }
.hl { display: grid; gap: 8px; margin: 14px 0; }
.hl > div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.hl .tile { width: 30px; height: 30px; border-radius: 8px; }
.hl .tile svg.i { width: 16px; height: 16px; }
.nextbox { display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.nextbox svg.i { color: var(--accent); }
.src { color: var(--text-3); font-size: 12px; margin-top: 10px; }

svg text { fill: var(--text-2); font-size: 12px; }
.empty { color: var(--text-3); font-size: 14px; display: flex; gap: 10px; align-items: center; margin: 8px 0 0; }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 10px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); }
table.data th { color: var(--text-2); border-top: 0; }
#tip { position: fixed; pointer-events: none; z-index: 30; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .1s; max-width: 240px; }
.note-form textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.note-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.note-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.sm svg.i { width: 15px; height: 15px; }
.note .btn.ghost { background: var(--surface); }
.notes-list { display: grid; gap: 10px; }
.note { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.note .tile { width: 34px; height: 34px; border-radius: 10px; }
.note .tile svg.i { width: 18px; height: 18px; }
.note .when { color: var(--text-3); font-size: 12px; margin-top: 4px; }
.note.reviewed { opacity: .65; }
.note p { margin: 0; white-space: pre-wrap; }
footer.wrap { color: var(--text-3); font-size: 12px; padding-top: 16px; padding-bottom: 32px; }

@media (max-width: 520px) {
  .goal-nums .big { font-size: 22px; }
  .bar-row { grid-template-columns: 104px 1fr 56px; }
  .steps { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat .v { font-size: 20px; }
  .ph .mt { display: none; }
  .ph .nm { font-size: 12px; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"></button>
    <div class="brand"><b id="title"></b><span id="crumb"></span></div>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode"></button>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Pages">
  <div class="head"><b>Menu</b><button class="icon-btn" id="close-btn" type="button" aria-label="Close menu"></button></div>
  <div id="nav-links"></div>
  <div class="foot" id="updated"></div>
</nav>

<main class="wrap">
  <div class="view" id="v-plan"></div>
  <div class="view" id="v-progress"></div>
  <div class="view" id="v-recaps"></div>
  <div class="view" id="v-squads"></div>
  <div class="view" id="v-notes"></div>
</main>
<footer class="wrap" id="foot">Built from screen recordings. Detailed numbers live in the analysis sheet.</footer>
<div id="tip" role="tooltip"></div>

/* tooltip */
const tip = document.getElementById('tip');
function bindTip(node, html) {
  node.tabIndex = 0;
  const show = e => {
    tip.innerHTML = html; tip.style.opacity = 1;
    const r = node.getBoundingClientRect();
    const x = e && e.clientX ? e.clientX : r.left + r.width / 2;
    const y = e && e.clientY ? e.clientY : r.top;
    tip.style.left = Math.min(x + 12, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.max(8, y - tip.offsetHeight - 10) + 'px';
  };
  node.addEventListener('mousemove', show);
  node.addEventListener('focus', () => show());
  node.addEventListener('mouseleave', () => tip.style.opacity = 0);
  node.addEventListener('blur', () => tip.style.opacity = 0);
}

/* sync: when sync_url is set, checkmarks and notes are kept in the Google Sheet via Apps Script.
   This browser's storage is a cache so the page works offline. */
const SYNC = S.sync_url || '';
async function push(msg) {
  if (!SYNC) return null;
  try {
    const r = await fetch(SYNC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(msg) });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
async function pull() {
  if (!SYNC) return null;
  try { const r = await fetch(SYNC); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
const undone = s => s.base === 'done' ? 'todo' : s.base;
allSteps.forEach(s => { if (s.id in saved) s.status = saved[s.id] ? 'done' : undone(s); });
function toggleStep(id) {
  const s = allSteps.find(x => x.id === id);
  if (!s) return;
  s.status = s.status === 'done' ? undone(s) : 'done';
  saved[id] = s.status === 'done';
  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
  push({ action: 'check', id, done: saved[id] });
  const y = scrollY;
  renderPlan(); renderProgress();
  scrollTo(0, y);
  const again = document.querySelector(`.chk[data-id="${id}"]`);
  if (again) again.focus({ preventScroll: true });
}

  const done = s.status === 'done';
  return `<div class="step ${s.status}" style="--tc:${typeColor(s.type)}">
    <button class="chk" type="button" role="checkbox" aria-checked="${done}" data-id="${esc(s.id)}" aria-label="${esc(s.title)}: mark ${done ? 'not done' : 'done'}">${done ? ico('check') : ''}</button>
    <div class="tile" title="${esc((TYPE[s.type] || ['Other'])[0])}">${ico(s.type)}</div>
    <div><div class="ttl">${esc(s.title)}</div>${s.detail ? `<div class="dt">${esc(s.detail)}</div>` : ''}
      <div class="meta">${s.hero ? heroChip(s.hero) : ''}${costChip(s.cost)}</div></div>
  </div>`;
}

  for (let k = 0; k <= 4; k++) {
    const val = ymin + (ymax - ymin) * k / 4, yy = y(val);
    svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${(val / 1e6).toFixed(0)}M</text>`;
  }
  svg += `<line x1="${L}" x2="${W - R}" y1="${y(G.target)}" y2="${y(G.target)}" stroke="var(--text-3)" stroke-dasharray="4 4"/><text x="${W - R}" y="${y(G.target) - 6}" text-anchor="end">Target</text>`;
  svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map(p => x(p.date) + ',' + y(p.squad1)).join(' ')}"/>`;
  pts.forEach(p => {
    svg += `<circle class="pt" data-d="${p.date}" cx="${x(p.date)}" cy="${y(p.squad1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    svg += `<text x="${x(p.date)}" y="${H - 8}" text-anchor="middle">${fmtDate(p.date).replace(/, \d{4}/, '')}</text>`;
  });
  box.innerHTML = svg + '</svg>' + `<details><summary>Show as table</summary><table class="data"><tr><th>Date</th><th>Squad 1</th><th>Total power</th></tr>${pts.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${fmtM(p.squad1)}</td><td>${p.total.toLocaleString()}</td></tr>`).join('')}</table></details>`;
  box.querySelectorAll('.pt').forEach(c => { const p = pts.find(q => q.date === c.dataset.d); bindTip(c, `${fmtDate(p.date)}<br>Squad 1: <b>${fmtM(p.squad1)}</b>`); });
}

/* ---------- Recaps ---------- */
function renderRecaps() {
  const statIcon = ['power', 'squads', 'hero', 'medal'];
  document.getElementById('v-recaps').innerHTML = `<div class="tl">${S.recaps.slice().sort((a, b) => b.date.localeCompare(a.date)).map(r => `
    <article class="card recap">
      <div class="date">${fmtDate(r.date)}</div>
      <h3>${esc(r.title)}</h3>
      ${r.stats ? `<div class="stats">${r.stats.map((s, i) => `<div class="stat"><div class="l">${ico(statIcon[i] || 'flag')}${esc(s.label)}</div><div class="v">${esc(s.value)}</div></div>`).join('')}</div>` : ''}
      <div class="hl">${r.highlights.map(h => {
        const o = typeof h === 'string' ? { icon: 'flag', text: h } : h;
        return `<div><div class="tile" style="--tc:${typeColor(o.icon)}">${ico(o.icon)}</div><div>${esc(o.text)}</div></div>`;
      }).join('')}</div>
      ${r.next ? `<div class="nextbox">${ico('arrow')}<div><b>Next:</b> ${esc(r.next)}</div></div>` : ''}
      ${r.sources ? `<div class="src">From: ${esc(r.sources)}</div>` : ''}
    </article>`).join('')}</div>`;
}

/* ---------- Squads ---------- */
function renderSquads() {
  const v = document.getElementById('v-squads');
  v.innerHTML = `
    <div class="card"><div class="goal-title">${ico('squads')}Squad power · ${fmtDate(DATA.updated)}</div><div class="bars" id="squad-bars"></div></div>
    <div class="card"><div class="goal-title">${ico('hero')}Squad 1 heroes · dashed line is Kimberly, the benchmark</div><div class="bars" id="hero-bars"></div></div>`;
  const add = (id, rows, max, bench) => {
    const box = v.querySelector('#' + id);
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `<div class="nm">${r.avatar || ''}<div>${esc(r.label)}${r.sub || ''}</div></div>
        <div class="bar-track"><div class="bar" style="width:${(r.value / max * 100).toFixed(2)}%"></div>${bench ? `<div class="bench" style="left:${(bench / max * 100).toFixed(2)}%"></div>` : ''}</div>
        <div class="val">${fmtM(r.value)}</div>`;
      bindTip(row, r.tip);
      box.append(row);
    });
  };
  add('squad-bars', DATA.squads.map(s => ({
    label: 'Squad ' + s.n, value: s.power, sub: `<small>${esc(s.mix)}</small>`,
    tip: `<b>Squad ${s.n}</b>: ${fmtM(s.power)}<br>${s.heroes.map(esc).join(', ')}`
  })), Math.max(...DATA.squads.map(s => s.power)));
  const heroes = DATA.squad1.filter(h => h.power).sort((a, b) => b.power - a.power);
  const kim = (heroes.find(h => h.name === 'Kimberly') || heroes[0]).power;
  add('hero-bars', heroes.map(h => ({
    label: h.name, value: h.power, avatar: av(h.name),
    tip: `<b>${esc(h.name)}</b>: ${fmtM(h.power)}<br>${h.power >= kim ? 'Benchmark' : fmtM(kim - h.power) + ' behind Kimberly'}`
  })), kim * 1.05, kim);
}

/* ---------- Notes ---------- */
/* Notes live in this browser's storage, like the plan checkmarks. */
const NOTES = 'lw-notes', DRAFT = 'lw-note-draft';
const loadNotesData = () => { try { return JSON.parse(localStorage.getItem(NOTES) || '[]'); } catch (e) { return []; } };
const saveNotesData = n => { try { localStorage.setItem(NOTES, JSON.stringify(n)); } catch (e) {} };
const noteDate = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
function renderNotes() {
  const v = document.getElementById('v-notes');
  let draft = '';
  try { draft = localStorage.getItem(DRAFT) || ''; } catch (e) {}
  const notes = loadNotesData();
  const open = notes.filter(n => !n.reviewed), done = notes.filter(n => n.reviewed);
  const card = n => `<div class="note${n.reviewed ? ' reviewed' : ''}">
      <div class="tile" style="--tc:${n.reviewed ? 'var(--good)' : 'var(--accent)'}">${ico(n.reviewed ? 'check' : 'note')}</div>
      <div><p>${esc(n.text)}</p><div class="when">${noteDate(n.at)}${n.reviewed ? ' · reviewed ' + noteDate(n.reviewed) : ''}</div>
        <div class="note-row" style="justify-content:flex-start;margin-top:8px">
          <button class="btn ghost sm" type="button" data-act="toggle" data-id="${n.id}">${ico(n.reviewed ? 'arrow' : 'check')}${n.reviewed ? 'Move back' : 'Mark reviewed'}</button>
          <button class="btn ghost sm" type="button" data-act="del" data-id="${n.id}">${ico('close')}Delete</button>
        </div></div></div>`;
  v.innerHTML = `
    <div class="card note-form">
      <div class="goal-title">${ico('note')}Add a note for the next analysis</div>
      <textarea id="note-text" placeholder="e.g. Murphy's weapon took the universal shards; check his power next recording" aria-label="Note">${esc(draft)}</textarea>
      <div class="note-row">
        <span class="hint" style="margin:0">${ico('check')}${SYNC ? 'Saved to your analysis sheet.' : 'Saved on this device.'}</span>
        <button class="btn" id="note-add" type="button">${ico('note')}Add note</button>
      </div>
    </div>
    <div class="phase-head" style="margin:24px 0 10px"><h2 class="sec" style="margin:0">${ico('clock')}To consider next analysis</h2>
      ${open.length ? `<button class="btn ghost sm" id="note-copy" type="button">${ico('recaps')}Copy all</button>` : ''}</div>
    <div class="notes-list">${open.length ? open.map(card).join('') : `<p class="empty">${ico('check')}No notes waiting.</p>`}</div>
    <h2 class="sec">${ico('check')}Reviewed</h2>
    <div class="notes-list">${done.length ? done.map(card).join('') : `<p class="empty">${ico('clock')}Nothing reviewed yet.</p>`}</div>`;
  const ta = v.querySelector('#note-text'), add = v.querySelector('#note-add');
  const sync = () => { add.disabled = !ta.value.trim(); try { localStorage.setItem(DRAFT, ta.value); } catch (e) {} };
  ta.oninput = sync; sync();
  add.onclick = () => {
    const text = ta.value.trim();
    if (!text) return;
    const all = loadNotesData();
    const note = { id: Date.now().toString(36), text, at: Date.now(), reviewed: null };
    all.unshift(note);
    saveNotesData(all);
    push({ action: 'note-add', id: note.id, text });
    try { localStorage.removeItem(DRAFT); } catch (e) {}
    renderNotes();
  };
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    let all = loadNotesData();
    if (b.dataset.act === 'del') {
      if (!confirm('Delete this note?')) return;
      all = all.filter(n => n.id !== b.dataset.id);
      push({ action: 'note-delete', id: b.dataset.id });
    } else {
      all = all.map(n => n.id === b.dataset.id ? { ...n, reviewed: n.reviewed ? null : Date.now() } : n);
      push({ action: 'note-review', id: b.dataset.id, reviewed: !!all.find(n => n.id === b.dataset.id).reviewed });
    }
    saveNotesData(all);
    renderNotes();
  });
  const copy = v.querySelector('#note-copy');
  if (copy) copy.onclick = async () => {
    const txt = open.map(n => `- (${noteDate(n.at)}) ${n.text}`).join('\n');
    try { await navigator.clipboard.writeText(txt); copy.innerHTML = ico('check') + 'Copied'; }
    catch (e) { prompt('Copy your notes:', txt); }
  };
}

/* ---------- shell: menu, routing, theme ---------- */
const VIEWS = [
  { id: 'plan', name: 'Game plan', icon: 'plan' },
  { id: 'progress', name: 'Goal progress', icon: 'progress' },
  { id: 'recaps', name: 'Recaps', icon: 'recaps' },
  { id: 'squads', name: 'Squads', icon: 'squads' },
  { id: 'notes', name: 'Notes', icon: 'note' }
];
document.getElementById('title').textContent = S.title;
document.getElementById('updated').textContent = S.commander + ' · Updated ' + fmtDate(DATA.updated);
document.getElementById('menu-btn').innerHTML = ico('menu');
document.getElementById('close-btn').innerHTML = ico('close');
document.getElementById('nav-links').innerHTML = VIEWS.map(v => `<a href="#${v.id}" data-v="${v.id}">${ico(v.icon)}${v.name}</a>`).join('');
renderPlan(); renderProgress(); renderRecaps(); renderSquads(); renderNotes();
pull().then(st => {
  if (!st) return;
  saved = st.checks || {};
  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
  allSteps.forEach(s => { s.status = s.id in saved ? (saved[s.id] ? 'done' : undone(s)) : s.base; });
  saveNotesData(st.notes || []);
  const y = scrollY;
  renderPlan(); renderProgress(); renderNotes();
  scrollTo(0, y);
});
document.getElementById('foot').textContent += ' Site version: ' + DATA.built + '.';

const menuBtn = document.getElementById('menu-btn');
function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', open);
  if (open) (document.querySelector('#nav-links a[aria-current]') || document.querySelector('#nav-links a')).focus({ preventScroll: true });
}
menuBtn.onclick = () => setMenu(true);
document.getElementById('close-btn').onclick = () => { setMenu(false); menuBtn.focus({ preventScroll: true }); };
document.getElementById('scrim').onclick = () => setMenu(false);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { setMenu(false); menuBtn.focus({ preventScroll: true }); } });

function route() {
  const id = (location.hash || '#plan').slice(1);
  const view = VIEWS.find(v => v.id === id) || VIEWS[0];
  VIEWS.forEach(v => document.getElementById('v-' + v.id).classList.toggle('on', v === view));
  document.querySelectorAll('#nav-links a').forEach(a => {
    if (a.dataset.v === view.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  document.getElementById('crumb').textContent = view.name;
  document.title = view.name + ' · ' + S.title;
  setMenu(false);
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();

(function () {
  const root = document.documentElement, btn = document.getElementById('theme');
  try { const t = localStorage.getItem('lw-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const paint = () => { btn.innerHTML = ico(isDark() ? 'season' : 'moon'); };
  btn.onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('lw-theme', root.dataset.theme); } catch (e) {} paint(); };
  paint();
})();
</script>
</body>
